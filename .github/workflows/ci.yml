name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and unit tests
        run: |
          go vet ./...
          go vet -tags interop ./...
          go test -v ./...
      - name: Cross-compile arm64 and amd64
        run: make dist
